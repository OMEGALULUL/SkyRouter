<!--
  RECONSTRUCTED, NOT CAPTURED. The Auto Update page of a Cudy AP1300 (hardware
  "AP1300 V1.1", firmware 2.5.25-20260820-141832, GET
  /cgi-bin/luci/admin/system/autoupgrade?nomodal=), rebuilt from what was read off
  the real device: the form's action, its field names and values, the Update Time
  options and their labels, the dependency rules, the page's labels and the three
  requests its update-check script makes. The markup around them copies the
  captured Wi-Fi forms (ap1300_edit_wlan00.html) and status page; the token is a
  dummy. The result page of an update check has never been seen and is not here.
-->

<script type="text/javascript">//<![CDATA[
	// The three requests of the real page's update check; the code around them is not the router's.
	function update_check(token) {
		$.post("/cgi-bin/luci/admin/system/autoupgrade/updatecheck", { token: token }, function() {
			(function poll() {
				$.get("/cgi-bin/luci/admin/system/autoupgrade/checkstatus/000000000000", function(state) {
					if (state == "checkdone" || state == "timeout")
						location.href = "/cgi-bin/luci/admin/system/autoupgrade?updatecheck=&nomodal=";
					else
						setTimeout(poll, 1000);
				});
			})();
		});
	}
//]]></script>
</body>
