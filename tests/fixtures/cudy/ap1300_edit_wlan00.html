<script type="text/javascript">//<![CDATA[
function wireless_update_wlan00_encryption(value) {
	if (value == "psk2psk3") {
		$("[id='cbid.wireless.wlan00.encryption.tips.psk2psk3']").show();
		$("[id='cbid.wireless.wlan00.encryption.tips.psk3']").hide();
	} else if (value == "psk3") {
		$("[id='cbid.wireless.wlan00.encryption.tips.psk2psk3']").hide();
		$("[id='cbid.wireless.wlan00.encryption.tips.psk3']").show();
	} else {
		$("[id='cbid.wireless.wlan00.encryption.tips.psk2psk3']").hide();
		$("[id='cbid.wireless.wlan00.encryption.tips.psk3']").hide();
	}

	cbi_d_update();
}
wireless_update_wlan00_encryption("psk-mixed");
