<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skybre Router Manager</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}h1{font-size:19px;margin:0}main{padding:24px;max-width:1200px;margin:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}.card,.device{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px}.summary strong{display:block;font-size:26px;margin-top:4px}.label{color:var(--muted)}button{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:#21262d;color:var(--text);cursor:pointer}button:hover{border-color:var(--blue)}button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}button.danger{border-color:#8b2c2c}.devices{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.device h2{font-size:16px;margin:0}.device header{display:flex;justify-content:space-between;align-items:flex-start;padding:0;border:0;background:transparent;position:static}.device p{color:var(--muted);margin:5px 0 14px}.badge{border-radius:20px;padding:3px 9px;font-size:12px}.online{color:var(--green);background:rgba(63,185,80,.12)}.offline{color:var(--red);background:rgba(248,81,73,.12)}.unknown{color:var(--yellow);background:rgba(210,153,34,.12)}.facts{display:grid;gap:7px;margin-bottom:14px}.fact{display:flex;justify-content:space-between;gap:10px}.fact span:first-child{color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:48px;text-align:center;color:var(--muted);grid-column:1/-1}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;width:min(460px,92vw)}dialog::backdrop{background:rgba(0,0,0,.65)}label{display:block;margin:12px 0 6px}input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:#0d1117;color:var(--text)}dialog .actions{justify-content:flex-end;margin-top:18px}#notice{min-height:20px;color:var(--yellow);margin-bottom:12px}@media(max-width:600px){main{padding:16px}header{padding:14px 16px}}
</style>
</head>
<body>
<header><h1>Skybre Router Manager</h1><div class="toolbar"><button id="refresh-button">Refresh</button><button id="add-button">Add device</button><button id="discover-button">Scan network</button><button id="logout-button">Sign out</button></div></header>
<main><div id="notice"></div><section class="summary"><div class="card"><span class="label">Total</span><strong id="total">0</strong></div><div class="card"><span class="label">Online</span><strong id="online">0</strong></div><div class="card"><span class="label">Offline</span><strong id="offline">0</strong></div></section><section id="devices" class="devices"><div class="empty">No devices configured</div></section></main>
<dialog id="add-dialog"><form method="dialog" id="add-form"><h2>Add router</h2><label>Identifier<input name="id" required pattern="[A-Za-z0-9][A-Za-z0-9_.:-]*"></label><label>Vendor<select name="vendor"><option value="cudy">Cudy</option><option value="tenda">Tenda</option><option value="tplink">TP-Link</option></select></label><label>Host or VPN address<input name="host" required placeholder="192.168.1.1"></label><label>Username<input name="username" value="root" required></label><label>Password<input name="password" type="password" required autocomplete="new-password"></label><label>Model<input name="model"></label><label>Reboot time (HH:MM)<input name="reboot_at" value="04:00"></label><label>Reboot timezone<input name="timezone" value="UTC"></label><div class="actions"><button value="cancel" type="button" id="add-cancel">Cancel</button><button class="primary" value="save">Save</button></div></form></dialog>
<dialog id="password-dialog"><form method="dialog" id="password-form"><h2>Reset password</h2><p class="label" id="password-target"></p><label>New password<input name="password" type="password" required autocomplete="new-password"></label><label>Confirm password<input name="confirm" type="password" required autocomplete="new-password"></label><label class="label"><input type="checkbox" name="verify" checked style="width:auto"> Test the password against the router after saving</label><div class="actions"><button value="cancel" type="button" id="password-cancel">Cancel</button><button class="primary" value="save">Save</button></div></form></dialog>
<script nonce="__CSP_NONCE__">
let csrfToken='';
function notice(value,error=false){const node=document.getElementById('notice');node.textContent=value;node.style.color=error?'var(--red)':'var(--yellow)';if(value)setTimeout(()=>{node.textContent=''},5000)}
async function api(path,options={}){const headers=Object.assign({'Accept':'application/json'},options.headers||{});if(options.body&&!headers['Content-Type'])headers['Content-Type']='application/json';if(options.method&&options.method!=='GET')headers['X-CSRF-Token']=csrfToken;const response=await fetch(path,Object.assign({},options,{headers}));if(response.status===401){location.href='/login';throw new Error('authentication required')}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'request failed');return data}
async function loadDevices(){try{const data=await api('/api/devices?include_status=true');const list=data.devices||[];document.getElementById('total').textContent=list.length;document.getElementById('online').textContent=data.summary.online;document.getElementById('offline').textContent=data.summary.offline;const root=document.getElementById('devices');root.replaceChildren();if(!list.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No devices configured';root.append(empty);return}list.forEach(device=>root.append(card(device)))}catch(error){notice(error.message,true)}}
function card(device){const node=document.createElement('article');node.className='device';const head=document.createElement('header');const title=document.createElement('div');const name=document.createElement('h2');name.textContent=device.model||device.id;title.append(name);const sub=document.createElement('p');sub.textContent=device.vendor+' · '+device.host+' · '+device.id;title.append(sub);const badge=document.createElement('span');const status=device.status||{};const state=status.online===true?'online':status.online===false?'offline':'unknown';badge.className='badge '+state;badge.textContent=state;head.append(title,badge);node.append(head);const facts=document.createElement('div');facts.className='facts';[['Host',device.host],['Transport',device.transport],['Uptime',status.uptime_seconds!==undefined?status.uptime_seconds+' seconds':(status.uptime_text||status.uptime||'unknown')],['Firmware',status.firmware||'unknown']].forEach(([key,value])=>{const row=document.createElement('div');row.className='fact';const label=document.createElement('span');label.textContent=key;const val=document.createElement('span');val.textContent=String(value);row.append(label,val);facts.append(row)});node.append(facts);const actions=document.createElement('div');actions.className='actions';const reboot=document.createElement('button');reboot.className='danger';reboot.textContent='Reboot';reboot.onclick=()=>rebootDevice(device.id);const clients=document.createElement('button');clients.textContent='Clients';clients.onclick=()=>showClients(device.id);const ssid=document.createElement('button');ssid.textContent='Change SSID';ssid.onclick=()=>changeSsid(device.id);const password=document.createElement('button');password.textContent='Password';password.onclick=()=>showPassword(device.id);const remove=document.createElement('button');remove.className='danger';remove.textContent='Remove';remove.onclick=()=>removeDevice(device.id);actions.append(reboot,clients,ssid,password,remove);node.append(actions);return node}
async function rebootDevice(id){if(!confirm('Reboot '+id+'?'))return;try{await api('/api/devices/'+encodeURIComponent(id)+'/reboot',{method:'POST',body:JSON.stringify({confirm:true})});notice('Reboot initiated for '+id);setTimeout(loadDevices,3000)}catch(error){notice(error.message,true)}}
async function removeDevice(id){if(!confirm('Remove '+id+' from this manager?\n\nThis deletes the saved configuration and its stored password. The router itself is not changed.'))return;try{await api('/api/devices/'+encodeURIComponent(id),{method:'DELETE'});notice('Removed '+id);await loadDevices()}catch(error){notice(error.message,true)}}
async function showClients(id){try{const data=await api('/api/devices/'+encodeURIComponent(id)+'/clients');const clients=data.clients||[];notice(clients.length?clients.length+' connected client(s)':'No connected clients reported')}catch(error){notice(error.message,true)}}
function changeSsid(id){const value=prompt('New SSID for '+id);if(!value)return;api('/api/devices/'+encodeURIComponent(id)+'/ssid',{method:'POST',body:JSON.stringify({ssid:value})}).then(()=>notice('SSID change sent to '+id)).catch(error=>notice(error.message,true))}
function showAdd(){document.getElementById('add-dialog').showModal()}
let passwordTarget='';
function showPassword(id){passwordTarget=id;document.getElementById('password-target').textContent='Device: '+id;const form=document.getElementById('password-form');form.reset();document.getElementById('password-dialog').showModal();form.elements.password.focus()}
document.getElementById('password-form').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData(event.target);const password=String(form.get('password')||'');const confirm=String(form.get('confirm')||'');if(!password){notice('Enter a new password',true);return}if(password!==confirm){notice('Passwords do not match, nothing was changed',true);return}try{const result=await api('/api/devices/'+encodeURIComponent(passwordTarget)+'/password',{method:'POST',body:JSON.stringify({password,verify:form.get('verify')==='on'})});document.getElementById('password-dialog').close();event.target.reset();if(result.verified&&!result.verified.ok){var v=result.verified;notice(v.reason==='rejected'?'Saved, but the router rejected the password: '+(v.error||'authentication failed'):'Saved, but the router could not be reached, so the password is unverified: '+(v.error||'no response'),true)}else if(result.verified){notice('Password saved and verified for '+passwordTarget)}else{notice('Password saved for '+passwordTarget)}
loadDevices()}catch(error){notice(error.message,true)}});
document.getElementById('add-form').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData(event.target);const rebootAt=String(form.get('reboot_at')||'04:00');const timezone=String(form.get('timezone')||'UTC');try{await api('/api/devices',{method:'POST',body:JSON.stringify({id:form.get('id'),vendor:form.get('vendor'),host:form.get('host'),username:form.get('username'),password:form.get('password'),model:form.get('model'),reboot:{enabled:false,at:rebootAt,timezone,window_minutes:15,min_uptime_seconds:3600,cooldown_seconds:21600}})});document.getElementById('add-dialog').close();event.target.reset();notice('Device added');loadDevices()}catch(error){notice(error.message,true)}})
async function discover(){const subnet=prompt('Subnet to scan','192.168.1.0/24');if(!subnet)return;notice('Scanning '+subnet);try{const data=await api('/api/discover',{method:'POST',body:JSON.stringify({subnet})});notice((data.devices||[]).length+' candidate device(s) found')}catch(error){notice(error.message,true)}}
async function logout(){try{await api('/logout',{method:'POST'})}finally{location.href='/login'}}
document.getElementById('refresh-button').addEventListener('click',loadDevices);
document.getElementById('add-button').addEventListener('click',showAdd);
document.getElementById('discover-button').addEventListener('click',discover);
document.getElementById('logout-button').addEventListener('click',logout);
document.getElementById('add-cancel').addEventListener('click',()=>document.getElementById('add-dialog').close());
document.getElementById('password-cancel').addEventListener('click',()=>document.getElementById('password-dialog').close());
async function pollDevices(){try{await loadDevices()}catch(error){notice(error.message,true)}finally{setTimeout(pollDevices,30000)}}
(async()=>{try{const data=await api('/api/csrf');csrfToken=data.csrf_token}catch(error){notice(error.message,true)}pollDevices()})();
</script>
</body>
</html>
