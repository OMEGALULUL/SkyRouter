[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skybre-router-manager"
version = "2.0.0"
description = "Standalone manager for Cudy and Tenda routers with encrypted credential storage"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "PyYAML>=6.0",
    "paramiko>=3.4",
    "pysnmp>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-paramiko"]

[project.scripts]
router-manager = "cudy_manager.cli:main"

[tool.setuptools]
packages = ["cudy_manager"]
include-package-data = true

[tool.setuptools.package-data]
cudy_manager = ["*.html", "*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE", "BLE", "S"]
ignore = [
    "S104",
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
